function rollAllele(list) { let r = Math.random(); for (const [a, p] of list) { r -= p; if (r <= 0) return a; } return list[0][0]; }
function newGenes(sex, o) {
  o = o || {};
  const bw = o.base || [['A', 0.2], ['B', 0.56], ['b', 0.24]];
  const pw = o.pat || [['S', 0.1], ['C', 0.3], ['R', 0.52], ['N', 0.08]];
  const base = sex === 'E' ? [rollAllele(bw), rollAllele(bw)] : [rollAllele(bw)];
  return {
    base, pat: [rollAllele(pw), rollAllele(pw)],
    pied: [chance(o.pied != null ? o.pied : 0.12) ? 'P' : 'p', chance(o.pied != null ? o.pied : 0.12) ? 'P' : 'p'],
    grz: [chance(o.grz != null ? o.grz : 0.07) ? 'G' : 'g', chance(o.grz != null ? o.grz : 0.07) ? 'G' : 'g'],
    wht: [chance(o.wht != null ? o.wht : 0.05) ? 'w' : 'W', chance(o.wht != null ? o.wht : 0.05) ? 'w' : 'W']
  };
}
function phenoOf(g, sex) {
  let base = g.base[0];
  if (sex === 'E') base = BASE_RANK[g.base[0]] >= BASE_RANK[g.base[1]] ? g.base[0] : g.base[1];
  const pat = PAT_RANK[g.pat[0]] >= PAT_RANK[g.pat[1]] ? g.pat[0] : g.pat[1];
  const pied = (g.pied[0] === 'P' ? 1 : 0) + (g.pied[1] === 'P' ? 1 : 0);
  return { base, pat, pied, grz: g.grz[0] === 'G' || g.grz[1] === 'G', white: g.wht[0] === 'w' && g.wht[1] === 'w' };
}
function inheritGenes(sg, dg, sex) {
  const mut = () => chance(0.012);
  const base = [];
  base.push(pick(sg.base)); // babadan (erkekte iki alel olduğundan biri)
  if (sex === 'E') base.push(dg.base[0]); // anne yalnızca tek Z taşır
  const al = (arr, alts) => { const a = pick(arr); return mut() ? pick(alts) : a; };
  return {
    base: base.map(x => mut() ? pick(['A', 'B', 'b']) : x),
    pat: [al(sg.pat, ['S', 'C', 'R', 'N']), al(dg.pat, ['S', 'C', 'R', 'N'])],
    pied: [al(sg.pied, ['P', 'p']), al(dg.pied, ['P', 'p'])],
    grz: [al(sg.grz, ['G', 'g']), al(dg.grz, ['G', 'g'])],
    wht: [al(sg.wht, ['w', 'W']), al(dg.wht, ['w', 'W'])]
  };
}
const phenoKey = p => p.base + p.pat + p.pied + (p.grz ? 'g' : '') + (p.white ? 'w' : '');

/* ---- özellik seçimi ---- */
function pickTrait(breedId, sire, dam) {
  const isT = BREEDS[breedId].grp === 'T';
  if (sire && dam && chance(0.28)) { const p = chance(0.5) ? sire : dam; if (p.trait && (TRAITS[p.trait].kind !== 'quirk' || chance(0.5))) { if (isT || !TRAITS[p.trait].tum) return p.trait; } }
  const list = TRAIT_IDS.filter(t => isT || !TRAITS[t].tum);
  return wpick(list, t => TRAITS[t].w);
}
const traitMod = (b, key) => 0; // (yer tutucu; etkiler doğrudan hesaplanır)
const hasTrait = (b, id) => b && b.trait === id;

/* ---- istatistik ---- */
function makeStats(breed, sire, dam, trait) {
  const mean = STAT_MEAN[breed], st = {};
  for (const k of STAT_KEYS) {
    let v;
    if (sire && dam) {
      const mid = (sire.st[k] + dam.st[k]) / 2;
      v = mid * 0.86 + mean[k] * 0.14 + gauss() * 6; // seçerek üretince soy iyileşir
      if (sire.trait === 'sampiyon' || dam.trait === 'sampiyon') v += 3;
    } else v = mean[k] + gauss() * 11;
    st[k] = clamp(Math.round(v), 2, 99);
  }
  if (trait === 'isik_goz') st.bea = clamp(st.bea + 12, 2, 99);
  if (trait === 'hizli') st.spd = clamp(st.spd + 6, 2, 99);
  if (trait === 'dayanikli') st.sta = clamp(st.sta + 6, 2, 99);
  if (trait === 'pusula') st.nav = clamp(st.nav + 8, 2, 99);
  if (BREEDS[breed].fly.style === 'none' || BREEDS[breed].grp !== 'T') st.tum = Math.min(st.tum, 8);
  return st;
}

/* ---- isim / halka ---- */
function uniqueName(sex) {
  const pool = sex === 'E' ? NAMES_M : NAMES_F;
  const used = new Set(Object.values(S.birds).filter(b => b.loc.t !== 'gone').map(b => b.name));
  const free = pool.filter(n => !used.has(n));
  if (free.length) return pick(free);
  const base = pick(pool); let i = 2; while (used.has(base + ' ' + i)) i++; return base + ' ' + i;
}
function nextRing() { S.ringSeq++; return 'TR-' + String(26 + Math.floor(S.clock / 360)).slice(-2) + '-' + String(1000 + S.ringSeq).slice(-4); }

/* ---- kuş kaydı oluştur ---- */
function makeBird(o) {
  const sex = o.sex || (chance(0.5) ? 'E' : 'D');
  const breed = o.breed;
  const sire = o.sire ? S.birds[o.sire] : null, dam = o.dam ? S.birds[o.dam] : null;
  const genes = o.genes || (sire && dam ? inheritGenes(sire.g, dam.g, sex) : newGenes(sex, o.gopt || BREED_GOPT[breed]));
  const trait = o.trait || pickTrait(breed, sire, dam);
  const id = S.nextId++;
  const b = {
    id, name: o.name || uniqueName(sex), sex, breed, born: o.born != null ? o.born : S.bt,
    g: genes, sire: o.sire || null, dam: o.dam || null, gen: Math.max(sire ? sire.gen : 0, dam ? dam.gen : 0) + (sire || dam ? 1 : 0),
    st: o.st || makeStats(breed, sire, dam, trait), trait,
    ring: o.ring || null,
    food: 0.8, water: 0.8, hp: 1, fat: 0, ill: null, buff: {}, vacc: 0, stress: 0,
    mate: null, pair: null, nest: null,

function loseBird(b, T) {

/* ===== 48_gk: Güvercin Kümesi mantığı — hızlı üretim, bölme kapasitesi, soy puanı ve hedefi,

/* ---------- kümes geliştirme tanımları ---------- */
const UPG = {
  cap: { name: 'Bölmeyi genişlet', desc: 'Bölmeye +4 kuşluk yer açar', add: 4, costs: [2500, 6000, 12000] },
  inc: { name: 'Kuluçka makinesi', desc: 'Bu bölmedeki yumurtalar %30 daha çabuk çıkar, hiç soğumaz', cost: 3500 },
  autoF: { name: 'Otomatik yemlik', desc: 'Yemlik azalınca stoktan kendiliğinden doldurur', cost: 2800 },
  autoW: { name: 'Otomatik suluk', desc: 'Suluk azalınca ya da kirlenince kendiliğinden tazelenir', cost: 2200 }
};
/* ---------- soy hedefi: evde üretilmiş en iyi kuşun puanı ---------- */
const SOY = [{ n: 'Bronz', s: 66, rw: 750 }, { n: 'Gümüş', s: 72, rw: 2000 }, { n: 'Altın', s: 78, rw: 5000 }, { n: 'Elmas', s: 85, rw: 12000 }, { n: 'Efsane', s: 92, rw: 30000 }];
const SCORE_W = { T: { tum: 0.34, sta: 0.2, spd: 0.14, pow: 0.1, bea: 0.12, fer: 0.1 }, P: { spd: 0.3, nav: 0.3, sta: 0.25, pow: 0.15 }, K: { spd: 0.32, nav: 0.28, sta: 0.28, pow: 0.12 }, G: { bea: 0.6, fer: 0.2, pow: 0.2 } };

const scoreTier = s => s >= 92 ? 'Efsane' : s >= 85 ? 'Elmas' : s >= 78 ? 'Altın' : s >= 72 ? 'Gümüş' : s >= 66 ? 'Bronz' : '';
const TIER_COL = { Bronz: '#a8703a', Gümüş: '#7d8a96', Altın: '#c9a227', Elmas: '#3f8fb5', Efsane: '#8a4fb0' };

/* ---------- bölme kapasitesi ---------- */
const capOf = l => (CFG.CAP[LOFTDEFS[l].type] || 16) + UPG.cap.add * ((S.lofts[l] && S.lofts[l].lv) || 0);

  let n = 0;
  for (const id in S.birds) { const b = S.birds[id], t = b.loc.t; if (b.loc.l === l && (t === 'loft' || t === 'out' || t === 'air' || t === 'away')) n++; }
  for (const C of S.lofts[l].cells) for (const ns of C.nests) for (const eid of ns.eggs) { const e = S.eggs[eid]; if (e && e.state === 'ok') n++; }
  return n;
}
const roomFull = l => roomCount(l) >= capOf(l);

/* ---------- biyolojik saat: üreme ve büyüme hızlı akar (1 kuş günü ≈ 1 dakika) ---------- */
const bioMin = d => Math.max(0, Math.ceil(d / CFG.BIOK * CFG.DAYLEN / 60)); // kuş günü → gerçek dakika
function bioEta(d) { const m = bioMin(d), gd = d / CFG.BIOK; return m <= 0 ? 'birazdan' : (m < 60 ? '≈ ' + m + ' dk' : '≈ ' + Math.floor(m / 60) + ' sa ' + (m % 60) + ' dk') + (gd >= 0.5 ? ' (' + (Math.round(gd * 10) / 10).toLocaleString('tr-TR') + ' gün)' : ''); }

/* ---------- soy hedefi ---------- */

  if (!Game.offline) { say('🏆 Soy hedefi ' + SOY[k].n + '! ' + bb.b.name + ' ' + bb.s + ' puan · +' + fmtMoney(SOY[k].rw), 'g'); Bus.emit('sfx', 'buy'); }

/* ---------- otomatik eşleşme: boş yuvası olan bölmede en iyi, akraba olmayan çift ---------- */
let _apIdx = 0;
function autoPairTick() { // her seferinde tek bölme, en iyi 5 erkek × 5 dişi (takılma olmasın)
  if (S.set.autoPair === false) return;
  for (let tries = 0; tries < S.lofts.length; tries++) {
    const l = (_apIdx++) % S.lofts.length; if (freeNest(l, 0) < 0 || roomFull(l)) continue;
    const pool = []; for (const id in S.birds) { const b = S.birds[id]; if (b.loc.t === 'loft' && b.loc.l === l && !b.pair && !b.nest && !b.ill && !b.stray && !b.sale && !b._held && isAdult(b)) pool.push(b); }

/* ---------- satış: ilan ver, alıcılar telefondan alır ya da teklif yollar ---------- */

const saleOf = bid => (S.sales || []).find(s => s.bid === bid);
function saleOk(b) { return !!b && b.loc.t !== 'gone' && !b.nest && !b.stray && (b.loc.t === 'loft' || b.loc.t === 'out'); }
function listBird(b, price) {
  if (!b || b.loc.t === 'gone') return 'Kuş bulunamadı'; if (b.nest) return 'Yuvadaki yavru satışa çıkmaz'; if (b.stray) return 'Kaçak kuş satılamaz';

  const p = pairOf(b); if (p) unpairBirds(p.id, true);
  S.money += price; S.stats.sold++; S.stats.earned += price; const l = b.loc.l; b.loc = { t: 'gone' }; b.gone = 'satildi'; b.pair = null; b.mate = null;
  logEvent('📱 ' + who + ', ' + b.name + ' kuşunu ' + fmtMoney(price) + ' karşılığında aldı.', 'g'); if (l != null) refreshLoft(l);

/* alıcı gelme olasılığı (dakikada): fiyat değerin altındaysa hızlı, çok üstündeyse neredeyse hiç */
function saleChance(s) { const b = S.birds[s.bid]; if (!b) return 0; const r = s.price / Math.max(30, birdValue(b)); return clamp(0.42 * Math.pow(1 / r, 4), 0.003, 0.8); }
function salesStep(mins, offline) {

  for (const s of S.sales.slice()) {

    if (!saleOk(b)) continue; // havada / yolda: dönünce satılır
    const p = 1 - Math.pow(1 - saleChance(s), mins); if (!chance(p)) continue;

      const o = { id: 'f' + (S.nextId++), bid: s.bid, price: Math.max(30, Math.round(s.price * rr(0.78, 0.95) / 5) * 5), from: who, until: S.clock + 0.9 };
      S.offers.push(o); logEvent('📱 Teklif: ' + who + ', ' + b.name + ' için ' + fmtMoney(o.price) + ' veriyor (ilan ' + fmtMoney(s.price) + ').', 'i');

/* ---------- gençleri Yavru bölmesine taşı (yer açmak için) ---------- */
const youngMovable = (b, l) => b.loc.t === 'loft' && b.loc.l === l && !b.nest && !b.pair && !b.sale && !isAdult(b) && birdAge(b) >= CFG.FLEDGE;

/* ---------- her kare: zamanlayıcılar ---------- */
const GKT = { pair: 20, sale: 0, soy: 0, care: 0 };
function tickGK(dt) {

/* uygulama kapalıyken geçen süre: satışlar (en çok 2 saatlik) ve otomatik bakım */

const PR = 0.27;                        // oyuncu yarıçapı

/* ---------- yardımcılar ---------- */

    const x = Math.random() * 28, y = Math.random() * 16, z = Math.random() * 28;
    for (let k = 0; k < 2; k++) { const o = (i * 2 + k) * 3; pos[o] = x; pos[o + 1] = y; pos[o + 2] = z; end[i * 2 + k] = k; }

    transparent: true, depthWrite: false, fog: false, uniforms: { uT: { value: 0 }, uCam: { value: new THREE.Vector3() }, uA: { value: 0 } },

  for (const id of Array.from(BV.all.keys())) { const v = BV.all.get(id); if (v && v.active) { try { bvDeactivate(v); } catch (e) { } } BirdViews.remove(id); }
  BM.occ = {}; BM.list.length = 0; FL.kits.length = 0; FL.board = {}; FL.roof = {}; FL.pend = {}; if (typeof WCam !== 'undefined') { WCam.on = false; WCam.pendingT = 0; }
  Pl.hold = null; Pl.filling = null; Pl.target = null; if (Pl.hand) Pl.hand.visible = false; if (Pl.heldMesh) Pl.heldMesh.visible = false;
  G.tapOn = false; Game.ff = null; const fd = $('#fade'); if (fd) fd.classList.remove('on');
  for (const b of Object.values(S.birds)) {
    if (b.stray && b.loc.t === 'air') { strayGone(b); continue; }
    if (b.loc.t === 'held') { const f = b.loc.from || {}; b.loc = f.t === 'out' ? { t: 'out', l: f.l, x: f.x, z: f.z, since: S.clock } : { t: 'loft', l: f.l != null ? f.l : (b.loc.l || 0), c: f.c != null ? f.c : (b.loc.c || 0) }; }
    else if (b.loc.t === 'air') b.loc = { t: 'loft', l: b.loc.l || 0, c: b.loc.c || 0 };
    if (b.loc.t === 'out' && b.loc.board) delete b.loc.board;
    if (b.loc.t === 'away' && !(S.trips || []).some(T => T.id === b.loc.trip && !T.done)) { b.loc = { t: 'loft', l: b.loc.l || 0, c: 0 }; b.trip = null; }
    delete b._held;
  }
  if (S.holdW) Pl.hold = { kind: 'waterer', amt: S.holdW.amt || 0, dirty: S.holdW.dirty || 0 }; S.holdW = null;
  if (!S.epoch || !isFinite(S.epoch)) S.epoch = Math.floor(localDays() - (isFinite(S.clock) ? S.clock : 0));
  if (!isFinite(S.clock)) S.clock = 40 + hourToFrac(8);
  delete S.speed; _lastHr = Math.floor(hourNow());
  G.clouds = { acik: 0.2, bulutlu: 0.62, yagmur: 0.96, ruzgar: 0.38 }[S.weather] || 0.3;
  refreshAllLofts(); updateLofts(0.01); if (UI.el) UI.markLogSeen();
  if (Game.started) Game.placePlayer();
  Input.mv.x = Input.mv.y = 0;
};

/* ---------- kayıt ---------- */
Game.save = function (force) {
  if (!S || (!Game.started && !force)) return false;
  try {
    if (Game.started) S.pl = { x: +Pl.pos.x.toFixed(2), z: +Pl.pos.z.toFixed(2), yaw: +Pl.yaw.toFixed(2) };
    S.holdW = Pl.hold && Pl.hold.kind === 'waterer' ? { amt: Math.round(Pl.hold.amt), dirty: +(Pl.hold.dirty || 0).toFixed(2) } : null;
    S.lastReal = Date.now(); const txt = serializeState(), ok = lsSet(SAVE_KEY, txt), now = Date.now();
    if (Save.cloud && (force || now - Game.cloudT > 120000)) { Game.cloudT = now; Save.writeCloud(txt); }
    return ok;
  } catch (e) { console.warn('kayıt', e); return false; }
};
Game.autosave = function (dt) {
  if (!Game.started) return; Game.saveT += dt; if (Game.saveT > 75 && !Game.ff) { Game.saveT = 0; Game.save(); }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) { Game.hiddenAt = Date.now(); Game.save(); } else if (Game.started && Game.hiddenAt) { const ms = Date.now() - Game.hiddenAt; Game.hiddenAt = 0; Game.tPrev = undefined; Game.resumeGap(ms); } });
window.addEventListener('pagehide', () => Game.save());

/* ---------- olay bağları ---------- */
Game.hooks = function () {
  Bus.on('evening', () => {
    if (!Game.started || Game.offline) return;
    const open = S.lofts.filter(L => L.door || L.hatch.some(Boolean)).length;
    evening(); if (open) toast('Akşam oldu: kapakları kapat', 'w');
  });
  Bus.on('bird-dead', b => { if (Game.offline && Game.cu) Game.cu.dead++; if (Game.started && !Game.offline && b) toast((b.name || 'Bir kuş') + ' öldü', 'b'); });
  Bus.on('sick', b => { if (Game.offline && Game.cu) Game.cu.sick++; if (Game.started && !Game.offline && b) toast(b.name + ' hasta görünüyor', 'w'); });
  Bus.on('fledge', b => { if (Game.offline && Game.cu) Game.cu.fledge++; });
  Bus.on('hatch', () => { if (Game.offline && Game.cu) Game.cu.hatch++; });
  Bus.on('weather', w => { if (Game.started && !Game.offline && w === 'yagmur') toast('Yağmur başladı', 'i'); });
  Bus.on('kit-start', kit => { Game.saveT = Math.min(Game.saveT, 20); if (kit && !kit.arrival) WCam.kitId = kit.id; if (kit && !kit.arrival && Game.started && !Game.offline && S.set.autoCam !== false && !WCam.on) WCam.pendingT = 2.6; });
  Bus.on('trip', () => { Game.saveT = Math.min(Game.saveT, 40); });
  Bus.on('arrival', () => { Game.saveT = Math.min(Game.saveT, 40); if (Game.started && S.set.autoCam !== false && !WCam.on && !(WCam.pendingT > 0)) WCam.pendingT = 1.2; });
};

/* ---------- zaman akışı ---------- */
Game.simStep = function (dt) {
  if (!Game.started) return;
  Game.simAcc = (Game.simAcc || 0) + dt / CFG.DAYLEN; // oyun günü
  if (Game.simAcc < 0.0005) return;                     // ≈ 0,4 sn biriktir
  let left = Game.simAcc; Game.simAcc = 0;
  while (left > 1e-9) { const d = Math.min(left, 0.01); simTick(d); left -= d; }
};
/* test ve geliştirme: oyun zamanını ilerlet (gün) */
Game.devAdvance = function (days) { let left = days; while (left > 1e-9) { const d = Math.min(left, 0.01); simTick(d); left -= d; } tickTrips(); };
/* arka plandan dönünce ya da kayıttan açınca: aradaki gerçek süreyi en çok 1 oyun günü olarak işle */
Game.resumeGap = function (ms) { const g = Math.min(CFG.OFF_CAP, Math.max(0, ms) / 1000 / CFG.DAYLEN); if (g > 0.02) { try { Game.catchUp(g); } catch (e) { Game.offline = false; Game.onErr('catchUp', e); } } };
/* uzun süre kapalı/arka planda kalınca: aradaki süreyi hızlı işle (ölüm ve salgın yumuşatılmış) */
Game.catchUp = function (gap) {
  if (!(gap > 0)) return; gap = Math.min(gap, CFG.OFF_CAP);
  try { forceLandAll(); } catch (e) { }
  const sum = Game.cu = { hatch: 0, sick: 0, dead: 0, fledge: 0 };
  Game.offline = true; Game.bioLeft = CFG.BIO_OFF;
  try { let left = gap; while (left > 1e-9) { const d = Math.min(left, 0.01); simTick(d); left -= d; } tickTrips(); gkOffline(gap); }
  finally { Game.offline = false; }
  refreshAllLofts(); Bus.emit('inv'); Bus.emit('pairs');
  if (gap > 0.05 && Game.started) {
    const parts = [];
    if (sum.hatch) parts.push(sum.hatch + ' yumurta çıktı'); if (sum.fledge) parts.push(sum.fledge + ' yavru yuvadan çıktı');
    if (sum.sick) parts.push(sum.sick + ' kuş hastalandı'); if (sum.dead) parts.push(sum.dead + ' kuş öldü');
    setTimeout(() => toast('Sen yokken ' + (gap >= 0.99 ? '1 gün' : Math.max(1, Math.round(gap * 24)) + ' saat') + ' geçti' + (parts.length ? ': ' + parts.join(', ') : ''), sum.dead || sum.sick ? 'w' : 'i'), 1200);
  }
};
Game.endFF = function () { };
Game.titleCam = function (dt) {
  Game.titleT += dt; const t = Game.titleT, a = 0.35 + t * 0.04, R = 27 + 3 * Math.sin(t * 0.07);
  G.cam.position.set(Math.sin(a) * R, 4.4 + 1.1 * Math.sin(t * 0.11), 2 + Math.cos(a) * R); G.cam.lookAt(0, 2.2, -2);
  const ar = VP.W / Math.max(1, VP.H), f = ar < 1 ? 80 : 58; if (Math.abs(G.cam.fov - f) > 0.01) { G.cam.fov = f; G.cam.updateProjectionMatrix(); }
};

/* ---------- dünya efektleri (musluk, yağmur, gökyüzü) ---------- */
Game.worldFx = function (dt) {
  const wt = { acik: 0.2, bulutlu: 0.62, yagmur: 0.96, ruzgar: 0.38 }[S.weather]; G.clouds = damp(G.clouds, wt == null ? 0.3 : wt, 0.5, dt);
  G.windT += dt; if (G.grassT) G.grassT.value = G.windT * (S.weather === 'ruzgar' ? 1.9 : 1);
  updateSky(hourNow(), dt, G.cam.position);
  const on = !!G.tapOn, T = Game.t;
  G.hoseV = damp(G.hoseV || 0, on ? 1 : 0, 10, dt);
  if (G.hoseStream) { const s = G.hoseStream; s.visible = G.hoseV > 0.05; if (s.visible) { const fl = 0.85 + 0.3 * Math.sin(T * 31) * Math.sin(T * 17); s.scale.set(fl, 1, fl); s.material.opacity = 0.3 + 0.28 * G.hoseV; } }
  if (G.puddle) {
    const P = G.puddle; if (!P.userData.fixed) { P.geometry.dispose(); P.geometry = new THREE.CircleGeometry(1, 24); P.userData.fixed = true; }
    Game.tapSize = clamp(Game.tapSize + (on ? 0.1 : -0.02) * dt, 0, 0.8); const s = Game.tapSize; P.visible = s > 0.03; P.scale.set(s, s, 1);
  }
  if (G.tapHandle) G.tapHandle.rotation.z = damp(G.tapHandle.rotation.z, on ? 1.7 : 0, 8, dt);
  if (G.boxInd) { const ready = S.orders.some(o => o.ready); G.boxInd.visible = ready; if (ready) { G.boxInd.position.y = 1.75 + Math.sin(T * 3) * 0.08; G.boxInd.rotation.y += dt * 2; } }
  if (G.rain) {
    Game.rainA = damp(Game.rainA, S.weather === 'yagmur' ? 1 : 0, 0.7, dt); const r = G.rain, u = r.material.uniforms;
    r.visible = Game.rainA > 0.03 && !inBuilding(G.cam.position.x, G.cam.position.z); if (r.visible) { u.uT.value += dt; u.uCam.value.copy(G.cam.position); u.uA.value = Game.rainA; }
  }
};

/* ---------- kare ---------- */
Game.update = function (dt) {
  if (!Game.started) Game.titleCam(dt); else safe('player', () => Pl.update(dt));
  safe('sim', () => Game.simStep(dt));
  safe('kits', () => { tickOrders(); tickKits(dt); tickOutFar(dt); tickTrips(); tickGrain(dt); });
  safe('btex', () => tickBirdTex());
  safe('gk', () => tickGK(dt));
  safe('stray', () => strayTick(dt));
  safe('lofts', () => updateLofts(dt));
  safe('birds', () => BM.update(dt, G.cam.position));
  safe('world', () => Game.worldFx(dt));
  safe('audio', () => Audio3.update(dt, { inside: !WCam.on && inBuilding(Pl.pos.x, Pl.pos.z), birds: BM.list }));
  safe('ui', () => UI.update(dt));
  Game.autosave(dt);
};
Game.render = function () {
  // gölge haritası: yalnız güneş belirgin kayınca ya da 30 sn'de bir (her karede değil — takılma yapmaz)
  if (G.sun.castShadow && (G.shadowDirty || Game.t - (G.shadowT || -99) > 120)) { G.shadowDirty = false; G.shadowT = Game.t; G.R.shadowMap.needsUpdate = true; }
  G.R.render(G.scene, G.cam);
};
Game.perf = function (dt, now) {
  Game.fpsAcc += dt; Game.fpsN++;
  if (Game.fpsAcc < 3) return; const avg = Game.fpsAcc / Game.fpsN; Game.fps = 1 / avg; Game.fpsAcc = 0; Game.fpsN = 0;
  if (Game.test || !Game.started || !((S.set.q || 'auto') === 'auto')) return;
  if (avg > 0.036 && G.qLevel > 0 && now - Game.qChange > 8000) { Game.qChange = now; applyQualityLevel(G.qLevel - 1); }
};
Game.frame = function (now) {
  requestAnimationFrame(Game.frame);
  if (!Game.booted) return;
  const t = now / 1000; if (Game.tPrev === undefined) { Game.tPrev = t; return; }
  let dt = t - Game.tPrev; Game.tPrev = t; if (!(dt > 0)) return;
  dt = Math.min(dt, 0.1); Game.t += dt;
  Game.update(dt); safe('render', () => Game.render()); Game.perf(dt, now);
};

Game.boot();

</script>
